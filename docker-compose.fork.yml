services:
  anvil:
    image: "${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:v1.5.1}"
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "1"
      - "--fork-url"
      - "${MAINNET_RPC_URL:?MAINNET_RPC_URL is required}"
      - "--fork-block-number"
      - "${FORK_BLOCK:?FORK_BLOCK is required}"
      - "--state"
      - "/anvil-state/state.json"
      - "--state-interval"
      - "${ANVIL_STATE_INTERVAL_SECONDS:-5}"
      - "--accounts"
      - "20"
      - "--balance"
      - "1000000"
      - "--mnemonic"
      - "test test test test test test test test test test test junk"
    ports:
      - "127.0.0.1:${ANVIL_PORT:-8545}:8545"
    volumes:
      - "${ANVIL_DATA:-./.fork/data/anvil}:/anvil-state"
    cpus: "${ANVIL_CPUS:-2}"
    mem_limit: "${ANVIL_MEMORY:-2g}"
    healthcheck:
      test:
        [
          "CMD",
          "cast",
          "block-number",
          "--rpc-url",
          "http://127.0.0.1:8545",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  graph-node:
    image: "${GRAPH_NODE_IMAGE:-graphprotocol/graph-node:v0.45.0}"
    platform: "${GRAPH_NODE_PLATFORM:-linux/amd64}"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      ethereum: "mainnet:http://anvil:8545"
      ETHEREUM_POLLING_INTERVAL: "${GRAPH_ETHEREUM_POLLING_INTERVAL_MS:-2000}"
      GRAPH_ETHEREUM_CLEANUP_BLOCKS: "${GRAPH_ETHEREUM_CLEANUP_BLOCKS:-true}"
      GRAPH_QUERY_CACHE_BLOCKS: "${GRAPH_QUERY_CACHE_BLOCKS:-1}"
      GRAPH_QUERY_CACHE_MAX_MEM: "${GRAPH_QUERY_CACHE_MAX_MEM_MB:-64}"
      GRAPH_ENTITY_CACHE_SIZE: "${GRAPH_ENTITY_CACHE_SIZE_KB:-10000}"
      GRAPH_POI_ACCESS_TOKEN: "${GRAPH_POI_ACCESS_TOKEN:-local-fork-only}"
    cpus: "${GRAPH_NODE_CPUS:-2}"
    mem_limit: "${GRAPH_NODE_MEMORY:-2g}"
    ports: !override
      - "127.0.0.1:${FORK_GRAPH_HTTP_PORT:-18000}:8000"
      - "127.0.0.1:${FORK_GRAPH_WS_PORT:-18001}:8001"
      - "127.0.0.1:${FORK_GRAPH_ADMIN_PORT:-18020}:8020"
      - "127.0.0.1:${FORK_GRAPH_STATUS_PORT:-18030}:8030"
      - "127.0.0.1:${FORK_GRAPH_METRICS_PORT:-18040}:8040"

  ipfs:
    cpus: "${IPFS_CPUS:-1}"
    mem_limit: "${IPFS_MEMORY:-512m}"
    ports: !override
      - "127.0.0.1:${FORK_IPFS_API_PORT:-15001}:5001"

  postgres:
    cpus: "${POSTGRES_CPUS:-1}"
    mem_limit: "${POSTGRES_MEMORY:-1g}"
    ports: !reset []
